name: Unity Tests

on:
  push:
    branches: [main, master]
    paths:
      - "Verve.Core/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "Verve.Core/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

env:
  TEST_PROJECT_PATH: ".ci/unity-project"

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unity ${{ matrix.unityVersion }} ${{ matrix.testMode }} tests
    runs-on: ubuntu-latest
    env:
      UNITY_VERSION: ${{ matrix.unityVersion }}
      TEST_FRAMEWORK_VERSION: ${{ matrix.testFrameworkVersion }}
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - unityVersion: "2021.3.21f1"
            unityImage: "unityci/editor:ubuntu-2021.3.21f1-linux-il2cpp-1"
            testFrameworkVersion: "1.3.3"
            testMode: editmode
          - unityVersion: "2021.3.21f1"
            unityImage: "unityci/editor:ubuntu-2021.3.21f1-linux-il2cpp-1"
            testFrameworkVersion: "1.3.3"
            testMode: playmode
          - unityVersion: "6000.3.7f1"
            unityImage: "unityci/editor:ubuntu-6000.3.7f1-linux-il2cpp-3"
            testFrameworkVersion: "1.6.0"
            testMode: editmode
          - unityVersion: "6000.3.7f1"
            unityImage: "unityci/editor:ubuntu-6000.3.7f1-linux-il2cpp-3"
            testFrameworkVersion: "1.6.0"
            testMode: playmode

    steps:
      - name: Checkout package
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Create Unity test project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${TEST_PROJECT_PATH}/Assets" "${TEST_PROJECT_PATH}/Packages" "${TEST_PROJECT_PATH}/ProjectSettings"

          cat > "${TEST_PROJECT_PATH}/ProjectSettings/ProjectVersion.txt" <<EOF
          m_EditorVersion: ${UNITY_VERSION}
          EOF

          cat > "${TEST_PROJECT_PATH}/Packages/manifest.json" <<EOF
          {
            "dependencies": {
              "com.benfach.verve.core": "file:../../../Verve.Core",
              "com.unity.test-framework": "${TEST_FRAMEWORK_VERSION}"
            },
            "testables": [
              "com.benfach.verve.core"
            ]
          }
          EOF

      - name: Run Unity ${{ matrix.unityVersion }} ${{ matrix.testMode }} tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.TEST_PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: ${{ matrix.unityImage }}
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts/${{ matrix.unityVersion }}/${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity ${{ matrix.unityVersion }} ${{ matrix.testMode }} tests

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results-${{ matrix.unityVersion }}-${{ matrix.testMode }}
          path: artifacts/${{ matrix.unityVersion }}/${{ matrix.testMode }}
          if-no-files-found: warn
